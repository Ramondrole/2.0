<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community 2.0</title>
    <style>
        /* Общие сбросы и глобальный стиль */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Градиент из вашего логотипа (Розовый -> Голубой) */
            background: linear-gradient(135deg, #d88df5 0%, #81dff7 100%);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #3d0f6e; /* Тёмно-фиолетовый цвет текста */
            padding: 20px;
        }

        /* --- Навигация --- */
        .navbar {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 40px;
        }

        .logo-img {
            height: 50px;
            width: auto; 
            /* Если картинки нет, временно показывает текст */
            background: rgba(255,255,255,0.2); 
            border-radius: 50%;
            padding: 5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            flex-grow: 1;
        }

        .nav-links a {
            text-decoration: none;
            color: #3d0f6e;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(61, 15, 110, 0.15);
        }

        /* Контейнер для основного контента */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(61, 15, 110, 0.1);
            position: relative;
        }

        /* --- Переключатель 1 (iframe) --- */
        .iframe-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .switch-btn {
            border: none;
            background: rgba(61, 15, 110, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            color: #3d0f6e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-btn.active {
            background: #3d0f6e;
            color: white;
            box-shadow: 0 4px 10px rgba(61, 15, 110, 0.3);
        }

        .iframe-container {
            flex-grow: 1;
            height: 400px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            background: #fff;
            position: relative;
        }

        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .iframe-placeholder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 1.5rem;
        }

        /* --- Нижняя панель (Язык) --- */
        .bottom-panel {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            border-top: 1px solid rgba(61, 15, 110, 0.1);
            padding-top: 15px;
        }

        .lang-switcher {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 2px solid #3d0f6e;
            color: #3d0f6e;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #3d0f6e;
            color: white;
        }

        .lang-btn:hover {
            opacity: 0.8;
        }

        /* Стили для декоративных элементов (как на логотипе) */
        .decoration-shape {
            position: absolute;
            opacity: 0.3;
            pointer-events: none;
        }
        
        /* Адаптив для мобильных */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; align-items: flex-start; }
            .nav-links { flex-direction: column; width: 100%; gap: 10px; }
            .iframe-container { height: 300px; }
            .logo { margin-right: 0; }
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar">
        <div class="logo">
            <!-- Замените 'logo.png' на вашу картинку -->
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h2 style="font-weight: 900; color: #3d0f6e;">Community 2.0</h2>
        </div>
        <ul class="nav-links">
            <li><a href="#about-section">О нас</a></li>
            <!-- Прямая связь: mailto открывает почтовое приложение -->
            <li><a href="mailto:community2.0@example.com">Прямая связь</a></li>
            <li><a href="#channels-section">Каналы комьюнити</a></li>
        </ul>
    </nav>

    <!-- Основной блок -->
    <div class="main-wrapper">

        <!-- Переключатель Iframe (Середина) -->
        <div class="iframe-switcher">
            <button class="switch-btn active" onclick="changeIframe('https://www.wikipedia.org')">Википедия</button>
            <button class="switch-btn" onclick="changeIframe('https://www.google.com/webhp?igu=1')">Google</button>
            <button class="switch-btn" onclick="changeIframe('https://yandex.ru')">Яндекс</button>
        </div>

        <div class="iframe-container">
            <iframe id="main-iframe" src="https://www.wikipedia.org" allowfullscreen></iframe>
        </div>

        <!-- Нижняя панель (Переключатель языка) -->
        <div class="bottom-panel">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Функция для смены контента в IFrame
        function changeIframe(url) {
            const iframe = document.getElementById('main-iframe');
            iframe.src = url;
            
            // Обновление активной кнопки (визуально)
            const buttons = document.querySelectorAll('.switch-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 2. Функция для "переключения языка"
        // (В реальном проекте здесь бы менялся файл перевода или текст на странице)
        function changeLanguage(lang) {
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Демонстрация смены текста (заглушки)
            const title = document.querySelector('.logo h2');
            const btn1 = document.querySelector('.switch-btn:nth-child(1)');
            const btn2 = document.querySelector('.switch-btn:nth-child(2)');
            
            if(lang === 'en') {
                title.innerText = "Community 2.0";
                btn1.innerText = "Wikipedia";
                btn2.innerText = "Google";
                document.querySelector('.nav-links li:nth-child(1) a').innerText = "About";
                document.querySelector('.nav-links li:nth-child(2) a').innerText = "Contact";
            } else {
                title.innerText = "Community 2.0";
                btn1.innerText = "Википедия";
                btn2.innerText = "Google";
                document.querySelector('.nav-links li:nth-child(1) a').innerText = "О нас";
                document.querySelector('.nav-links li:nth-child(2) a').innerText = "Прямая связь";
            }
        }
    </script>

</body>
</html>
